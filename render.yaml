services:
  - type: web
    name: clan-nexus-backend
    runtime: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: MONGO_URL
        scope: run
        sync: false
      - key: DB_NAME
        value: clan_nexus
      - key: JWT_SECRET
        value: your-secret-key-change-this
      - key: CORS_ORIGINS
        value: "https://voluble-longma-e32a79.netlify.app,http://localhost:3000"
      - key: PORT
        value: "8000"
